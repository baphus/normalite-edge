# Blueprint for the API service.
#
# NOTE: this file lives in server/, not at the repo root. Render looks at the
# root by default, so it is only read if the Blueprint Path is set to
# `server/render.yaml`. If the service was created by hand in the dashboard
# instead, nothing here applies to it — which is why migrations are also run
# from `npm start` (see server/package.json). That belt-and-braces is
# deliberate: a schema change reaching production ahead of its migration takes
# down every request that touches the affected model.
services:
  - type: web
    name: normalite-edge-api
    env: node
    # Relative to the repo root. Without this, buildCommand would run at the
    # root, where there is no package.json.
    rootDir: server
    plan: standard
    region: ohio
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    # Runs after the build and before the new version takes traffic; a failure
    # fails the deploy and leaves the previous version serving. `npm start`
    # runs the same script, so migrations still apply if this never fires.
    preDeployCommand: npm run db:deploy
    # Health check path — Render defaults to `/`, but our health endpoint is at `/api/health`
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        scope: all
        value: production
      - key: DATABASE_URL
        scope: all
        sync: false
      - key: DIRECT_URL
        scope: all
        sync: false
      # Required for Supabase Auth verification (JWKS endpoint)
      - key: SUPABASE_URL
        scope: all
        sync: false
      # Service role key bypasses RLS — server-only, never expose to client
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: all
        sync: false
      # CORS allowlist — must match your Vercel frontend domain exactly (including https://)
      - key: CLIENT_URL
        scope: all
        sync: false
      # Optional: Cloudinary for avatar uploads
      - key: CLOUDINARY_CLOUD_NAME
        scope: all
        sync: false
      - key: CLOUDINARY_API_KEY
        scope: all
        sync: false
      - key: CLOUDINARY_API_SECRET
        scope: all
        sync: false
